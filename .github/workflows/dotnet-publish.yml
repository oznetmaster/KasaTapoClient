name: Publish public library release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Three-part public version
        required: true
        type: string
      artifact_run_id:
        description: Original successful build run for frozen-artifact recovery (no rebuild)
        type: string
      source_commit:
        description: Exact original 40-character source commit required for recovery
        type: string
      skip_desktop_checks:
        description: Reuse reviewed workstation validation
        type: boolean
        default: false
      desktop_skip_reason:
        description: Validated source, time, frameworks, counts and provenance
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor validation
        type: boolean
        default: false
      hardware_skip_reason:
        description: Validated source, time, selected tests, limitations and cleanup
        type: string
      validation_commit:
        description: Optional ancestor CI source permitted by the shared policy
        type: string
      documentation_patch:
        description: Existing documentation-only package maintenance mode
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: inputs.artifact_run_id == '' && inputs.documentation_patch != true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve public version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:REQUESTED_VERSION }
          $version = $version -creplace '^v', ''
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use a canonical three-part stable public version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oznetmaster/BuildAutomation/.github/actions/release-prepare@38d25666f55186e6ddbb73d256ac26524c1054bd
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Verify shared validation policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["unit-tests.yml"]'
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Stage packages and companion applications through Cake
        uses: oznetmaster/BuildAutomation@38d25666f55186e6ddbb73d256ac26524c1054bd
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          task: release-assets
      - uses: oznetmaster/BuildAutomation/.github/actions/release-freeze@38d25666f55186e6ddbb73d256ac26524c1054bd
        with:
          version: ${{ steps.version.outputs.version }}
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation/.github/actions/release-publish@38d25666f55186e6ddbb73d256ac26524c1054bd
        with:
          version: ${{ needs.build.outputs.version }}
  nuget-documentation:
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id == '' && inputs.documentation_patch == true
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verify strict XML documentation before publication
        shell: pwsh
        run: ./build/Invoke.ps1 -Task xml-documentation

      - name: Build and verify documentation-only package
        shell: pwsh
        run: ./tools/New-NuGetDocumentationPatch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: artifacts/nuget-documentation/*
          if-no-files-found: error

      - name: Authenticate to NuGet with GitHub OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: oznetmaster

      - name: Publish verified NuGet documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nuget-documentation -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified package.' }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet documentation patch publication failed.' }
  recover:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.documentation_patch != true
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Validate frozen-artifact recovery inputs
        shell: pwsh
        env:
          ORIGINAL_RUN: ${{ inputs.artifact_run_id }}
          ORIGINAL_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:ORIGINAL_RUN -cnotmatch '^[1-9][0-9]*$') { throw 'An original build run ID is required.' }
          if ($env:ORIGINAL_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'An exact original source commit is required.' }
          if ($env:RELEASE_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use a canonical three-part stable version.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation/.github/actions/release-publish@38d25666f55186e6ddbb73d256ac26524c1054bd
        with:
          version: ${{ inputs.version }}
          source-run-id: ${{ inputs.artifact_run_id }}
          source-commit: ${{ inputs.source_commit }}
