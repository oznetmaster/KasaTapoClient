name: Publish .NET Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      documentation_patch:
        description: Publish only the reviewed NuGet documentation patch; preserve existing runtime binaries and GitHub releases
        required: false
        type: boolean
        default: false
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  publish:
    if: inputs.documentation_patch != true
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: KasaClient/KasaTapoClient.csproj
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["unit-tests.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $rawVersion = switch ('${{ github.event_name }}') {
              'workflow_dispatch' { '${{ inputs.version }}'; break }
              'push' { '${{ github.ref_name }}'; break }
              default { '' }
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore solution
        run: dotnet restore KasaClient.slnx

      - name: Build solution
        run: dotnet build KasaClient.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }}

      - name: Run tests
        run: dotnet test KasaClient.Tests/KasaClient.Tests.csproj --configuration Release --no-build --framework net10.0 --filter "TestCategory!=Live"

      - name: Pack library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}/nuget" -Force | Out-Null
          dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }} -p:PackageVersion=${{ steps.version.outputs.package_version }} --output "${{ env.ARTIFACT_DIR }}/nuget"
          if ($LASTEXITCODE -ne 0) { throw 'NuGet pack failed.' }
          $packages = @(Get-ChildItem -LiteralPath "${{ env.ARTIFACT_DIR }}/nuget" -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one NuGet package.' }
          ./tools/Test-NuGetDocumentation.ps1 -PackagePath $packages[0].FullName

      - name: Publish package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}/nuget" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

      - name: Collect release assets
        shell: pwsh
        run: |
          $releaseDir = "${{ env.ARTIFACT_DIR }}/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $projectDir = Split-Path -Parent "${{ env.PROJECT_PATH }}"
          $frameworks = @('net472', 'net10.0')
          foreach ($framework in $frameworks) {
              $outputDir = Join-Path $projectDir "bin/Release/$framework"
              foreach ($extension in @('dll', 'xml')) {
                  $sourcePath = Join-Path $outputDir "KasaTapoClient.$extension"
                  if (Test-Path $sourcePath) {
                      Copy-Item $sourcePath (Join-Path $releaseDir "KasaTapoClient.$framework.$extension") -Force
                  }
              }
          }

      - name: Extract package release notes
        id: notes
        shell: pwsh
        run: |
          [xml]$xml = Get-Content -Path '${{ env.PROJECT_PATH }}' -Raw
          $releaseNotes = $xml.Project.PropertyGroup.PackageReleaseNotes | Where-Object { $_ } | Select-Object -First 1

          $notesPath = "${{ env.ARTIFACT_DIR }}/RELEASE_NOTES.md"
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
              Write-Warning 'No PackageReleaseNotes found in the project file.'
              '' | Out-File -FilePath $notesPath -Encoding utf8
          } else {
              $releaseNotes.Trim() | Out-File -FilePath $notesPath -Encoding utf8
          }

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release from tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_version }}
          name: ${{ steps.version.outputs.raw_version }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: |
            ${{ env.ARTIFACT_DIR }}/release/*.dll
            ${{ env.ARTIFACT_DIR }}/release/*.xml

  nuget-documentation:
    if: github.event_name == 'workflow_dispatch' && inputs.documentation_patch == true
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build and verify documentation-only package
        shell: pwsh
        run: ./tools/New-NuGetDocumentationPatch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: artifacts/nuget-documentation/*
          if-no-files-found: error

      - name: Publish verified NuGet documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nuget-documentation -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified package.' }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet documentation patch publication failed.' }
