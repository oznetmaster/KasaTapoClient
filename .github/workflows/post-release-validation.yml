name: Validate release source
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish .NET Package"]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: validate-release-source
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release-check policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          policy-tests-only: 'true'
      - name: Validate the current default-branch source
        uses: oznetmaster/BuildAutomation/.github/actions/post-release-validation@c650afeb23c584d68580440ef0f7baaf737cdfd0
        with:
          workflows: '["unit-tests.yml"]'
