name: Unit tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net10.0]
        suite:
          - name: client
            project: KasaClient.Tests/KasaClient.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run unit tests
        uses: oznetmaster/BuildAutomation@6f20e1937d3bab8ba7e545a3a77b6fe689f63f2e
        with:
          task: unit-tests-test-run-unit-tests
        env:
          BUILD_INPUT_0: ${{ matrix.suite.project }}
          BUILD_INPUT_1: ${{ matrix.framework }}
      - name: Retain unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.suite.name }}-${{ matrix.framework }}
          path: TestResults/*.trx
          if-no-files-found: warn
